name: CI/CD Pipeline - Build and Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    env:
      CI: true
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/collegehub_ci?schema=public"
      JWT_SECRET: "ci_jwt_secret_token_9f82d3a4b1c7e6_2026"
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Static Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
